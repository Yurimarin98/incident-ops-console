<div class="container py-4">
 
  
    
    <!-- SECCIÓN DE FILTROS Y BÚSQUEDA -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <div class="row g-3">
          <!-- Búsqueda -->
          <div class="col-md-4">
            <label class="form-label small fw-bold text-muted">Buscar (ID, Título, Servicio)</label>
            <input 
              type="text" 
              class="form-control form-control-sm" 
              placeholder="Ej. Checkout o Falla...">
          </div>
 
          <!-- Filtro Severidad -->
          <div class="col-md-3">
            <label class="form-label small fw-bold text-muted">Severidad</label>
            <select 
              class="form-select form-select-sm" >
              <option value="ALL">Todas las severidades</option>
              <option value="CRITICAL">Critical</option>
              <option value="HIGH">High</option>
              <option value="MEDIUM">Medium</option>
            </select>
          </div>
 
          <!-- Filtro Estado -->
          <div class="col-md-3">
            <label class="form-label small fw-bold text-muted">Estado</label>
            <select 
              class="form-select form-select-sm" >
              <option value="ALL">Todos los estados</option>
              <option value="OPEN">Open</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="RESOLVED">Resolved</option>
            </select>
          </div>
 
          <!-- Selector de cantidad de elementos dinámicos -->
          <div class="col-md-2">
            <label class="form-label small fw-bold text-muted">Por página</label>
            <select class="form-select form-select-sm" >
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20">20</option>
            </select>
          </div>
        </div>
      </div>
    </div>
 
    <!-- TABLA DE INCIDENTES -->
    <div class="card shadow-sm border-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark text-uppercase fs-7">
            <tr>
              <th>ID</th>
              <th>Título / Servicio</th>
              <th>Severidad</th>
              <th>Estado</th>
              <th>Fecha Creación</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
